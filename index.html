<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELUMALAI VEERAPPAN | Cuddalore Catch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #020617; color: white; overflow: hidden; font-family: sans-serif; }
        .hero-font { font-family: 'Playfair Display', serif; }
        .glimmer { color: #f59e0b; text-shadow: 0 0 25px rgba(245, 158, 11, 0.6); }
        .ui-gradient { background: linear-gradient(to top, #020617 0%, transparent 100%); }
    </style>
</head>
<body>

    <!-- HUD OVERLAY -->
    <div class="fixed inset-0 z-10 pointer-events-none flex flex-col justify-between p-8 md:p-16">
        <header>
            <div class="border-l-4 border-amber-500 pl-6">
                <h1 class="text-5xl md:text-7xl font-black italic tracking-tighter uppercase hero-font glimmer leading-none">
                    ELUMALAI <br> VEERAPPAN
                </h1>
                <p class="text-[10px] tracking-[0.6em] opacity-40 font-bold uppercase mt-4">
                    Daily Fresh • Cuddalore Old Town Port
                </p>
            </div>
        </header>

        <div class="ui-gradient absolute bottom-0 left-0 w-full h-1/2"></div>

        <footer class="relative flex flex-col md:flex-row justify-between items-end gap-10">
            <div class="max-w-md pointer-events-auto">
                <div class="flex items-center gap-3 mb-3">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_10px_#10b981]"></span>
                    <span class="text-emerald-500 text-[10px] font-bold tracking-[0.2em] uppercase font-sans">LIVE CATCH: SEER FISH (VANJARAM)</span>
                </div>
                <h2 class="text-4xl md:text-5xl font-black mb-4 hero-font italic text-white uppercase">Cuddalore Silver</h2>
                <p class="text-sm opacity-50 mb-8 leading-relaxed max-w-sm">
                    High-quality Seer fish, freshly sourced from Cuddalore Bay. Use your mouse to inspect the quality.
                </p>
                <a href="https://wa.me/91XXXXXXXXXX?text=Hi! I am looking for the fresh Vanjaram catch." 
                   target="_blank" 
                   class="inline-block bg-white text-black px-12 py-5 font-black text-[10px] uppercase tracking-[0.2em] hover:bg-amber-500 transition-all transform active:scale-95 shadow-2xl">
                   WHATSAPP ORDER (₹)
                </a>
            </div>
            <div class="text-right text-[9px] opacity-30 font-mono tracking-widest hidden md:block leading-loose">
                LOCATION: 11.7511° N / CUDDALORE PORT <br>
                EST. DELIVERY: WITHIN 2 HOURS
            </div>
        </footer>
    </div>

    <!-- CANVAS CONTAINER -->
    <div id="canvas-container" class="fixed inset-0 z-0 bg-slate-950"></div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020617, 0.15);
        
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. LIGHTING (To make it look Metallic/Vanjaram style)
        const ambLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambLight);
        const sun = new THREE.DirectionalLight(0xf59e0b, 3);
        sun.position.set(5, 5, 5);
        scene.add(sun);
        const blueRim = new THREE.PointLight(0x3b82f6, 5, 20);
        blueRim.position.set(-5, -3, 2);
        scene.add(blueRim);

        // 3. LOAD THE 3D FISH
        const loader = new GLTFLoader();
        let fish;

        // Using an optimized open-source Sleek Fish model
        const modelUrl = 'https://vazxmixjsiawhamofees.supabase.co/storage/v1/object/public/models/fish/model.gltf';

        loader.load(modelUrl, (gltf) => {
            fish = gltf.scene;
            
            // Adjust the metallic Vanjaram Look
            fish.traverse((child) => {
                if (child.isMesh) {
                    child.material.metalness = 1;
                    child.material.roughness = 0.2;
                    child.material.color.setHex(0xe2e8f0); // Pure Silver
                }
            });

            fish.scale.set(1.5, 1.5, 1.5);
            fish.rotation.y = Math.PI / 2;
            scene.add(fish);
        });

        // 4. FLOATING PARTICLES
        const pGeo = new THREE.BufferGeometry();
        const pCoords = new Float32Array(500 * 3);
        for(let i=0; i<500*3; i++) pCoords[i] = (Math.random() - 0.5) * 30;
        pGeo.setAttribute('position', new THREE.BufferAttribute(pCoords, 3));
        const pMat = new THREE.PointsMaterial({ size: 0.04, color: 0xffffff, transparent: true, opacity: 0.3 });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // 5. INTERACTION
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 1;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 1;
        });

        // 6. ANIMATION LOOP
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            if (fish) {
                // Gentle underwater sway
                fish.position.y = Math.sin(time * 0.5) * 0.2;
                fish.rotation.y = (Math.PI / 2) + Math.sin(time * 0.3) * 0.4;
                fish.rotation.z = Math.sin(time * 0.8) * 0.1;

                // Follow Mouse slightly
                fish.rotation.x += (mouseY * 0.1 - fish.rotation.x) * 0.05;
            }

            particles.rotation.y += 0.001;
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELUMALAI VEERAPPAN | Cuddalore Catch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #020617; color: white; overflow: hidden; }
        .hero-font { font-family: 'Playfair Display', serif; }
        .glimmer { color: #f59e0b; text-shadow: 0 0 25px rgba(245, 158, 11, 0.6); }
        .ui-gradient { background: linear-gradient(to top, #020617 0%, transparent 100%); }
    </style>
</head>
<body>

    <!-- HUD OVERLAY -->
    <div class="fixed inset-0 z-10 pointer-events-none flex flex-col justify-between p-8 md:p-16">
        <header>
            <div class="border-l-4 border-amber-500 pl-6">
                <h1 class="text-5xl md:text-7xl font-black italic tracking-tighter uppercase hero-font glimmer leading-none">
                    ELUMALAI <br> VEERAPPAN
                </h1>
                <p class="text-[10px] tracking-[0.6em] opacity-40 font-bold uppercase mt-4">
                    Daily Fresh • Cuddalore Old Town Port
                </p>
            </div>
        </header>

        <div class="ui-gradient absolute bottom-0 left-0 w-full h-1/2"></div>

        <footer class="relative flex flex-col md:flex-row justify-between items-end gap-10">
            <div class="max-w-md pointer-events-auto">
                <div class="flex items-center gap-3 mb-3">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_10px_#10b981]"></span>
                    <span class="text-emerald-500 text-[10px] font-bold tracking-[0.2em] uppercase">Catch Available: Vanjaram</span>
                </div>
                <h2 class="text-4xl md:text-5xl font-black mb-4 hero-font italic text-white uppercase">Cuddalore Silver</h2>
                <p class="text-sm opacity-50 mb-8 leading-relaxed max-w-sm">
                    Premium Seer Fish, handled with pride. Direct delivery from the "Elumalai Veerappan" boat to your gate.
                </p>
                <!-- NOTE: Change the XXXXXXXXXX below to your WhatsApp Number -->
                <a href="https://wa.me/91XXXXXXXXXX?text=Hi! Order for Elumalai Veerappan fresh Vanjaram." 
                   target="_blank" 
                   class="inline-block bg-white text-black px-12 py-5 font-black text-xs uppercase tracking-widest hover:bg-amber-500 transition-all transform active:scale-95 shadow-2xl">
                   WhatsApp Order (₹)
                </a>
            </div>
            <div class="text-right text-[9px] opacity-30 font-mono tracking-widest hidden md:block">
                EST: 11.7483° N, 79.7714° E <br>
                BAY OF BENGAL / CORE SECTOR
            </div>
        </footer>
    </div>

    <!-- CANVAS CONTAINER -->
    <div id="canvas-container" class="fixed inset-0 z-0 bg-slate-950"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020617, 0.12);
        
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambLight);
        const sun = new THREE.DirectionalLight(0xf59e0b, 2);
        sun.position.set(5, 10, 5);
        scene.add(sun);
        const glow = new THREE.PointLight(0x3b82f6, 4, 20);
        glow.position.set(-5, -5, -2);
        scene.add(glow);

        // SILVER FISH SHAPE
        const geometry = new THREE.TorusKnotGeometry(1.6, 0.4, 150, 20);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x94a3b8, 
            metalness: 1, 
            roughness: 0.05
        });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // OCEAN PARTICLES
        const pCount = 600;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        for(let i=0; i < pCount * 3; i++) { pPos[i] = (Math.random() - 0.5) * 40; }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ size: 0.03, color: 0xffffff, transparent: true, opacity: 0.4 });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        camera.position.z = 11;

        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function render() {
            const time = Date.now() * 0.0006;
            mesh.rotation.y += 0.005;
            mesh.rotation.z = Math.sin(time) * 0.3;
            
            particles.rotation.y += 0.001;
            
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(mesh.position);

            renderer.render(scene, camera);
            requestAnimationFrame(render);
        }
        render();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
